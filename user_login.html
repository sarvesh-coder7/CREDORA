<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>CREDORA | User Access</title>
    <link rel="icon" type="image/png" href="./ICON.png">
    <script type="module" src="supabaseClient.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 25px 7%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        header h1 {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .container {
            width: min(430px, 90%);
            margin: 35px auto 60px;
            flex: 1;
        }

        .back {
            display: inline-block;
            color: #555;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .back:hover {
            color: #000;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: clamp(32px, 7vw, 43px);
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 25px;
            border: 1px solid #000;
        }

        .tab {
            padding: 13px;
            border: 0;
            background: #fff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .tab.active {
            background: #000;
            color: #fff;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            background: #fff;
            color: #000;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border: 2px solid #000;
        }

        .submit {
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit:hover {
            background: #fff;
            color: #000;
        }

        .notice {
            margin-top: 18px;
            color: #777;
            font-size: 11px;
            line-height: 1.7;
        }

        footer {
            padding: 20px 7%;
            border-top: 1px solid #eee;
            color: #777;
            font-size: 11px;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <img src="./LOGO.jpeg" alt="CREDORA Logo">
        <h1>CREDORA</h1>
    </header>

    <main class="container">


        <p class="eyebrow">USER ACCOUNT</p>
        <a class="back" href="./introindex.html">← Back to home</a>
        <h2 id="heading">Welcome back.</h2>
        <p class="subtitle" id="subtitle">
            Sign in to access your CREDORA account.
        </p>

        <div class="tabs">
            <button class="tab active" id="loginTab" type="button">Login</button>
            <button class="tab" id="registerTab" type="button">Register</button>
        </div>

        <form id="userForm">
            <div class="field" id="nameField" hidden>
                <label for="name">FULL NAME</label>
                <input id="name" name="name" autocomplete="name" placeholder="Enter your full name">
            </div>

            <div class="field">
                <label for="email">EMAIL ADDRESS</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>

            <div class="field" id="phoneField" hidden>
                <label for="phone">PHONE NUMBER</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Enter phone number">
            </div>

            <div class="field">
                <label for="password">PASSWORD</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Enter your password" required>
            </div>

            <div class="field" id="confirmField" hidden>
                <label for="confirmPassword">CONFIRM PASSWORD</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                    placeholder="Re-enter your password">
            </div>

            <button class="submit" id="submitButton" type="submit">
                LOGIN TO YOUR ACCOUNT →
            </button>
        </form>

        <p class="notice" id="formMessage" aria-live="polite">
            Your account details should be kept secure.
        </p>
        <p class="notice">
            Are you a lender? <a href="./lender_login.html" style="color:#000">Lender access →</a>
        </p>
    </main>

    <footer>© <span id="year"></span> CREDORA</footer>

    <script type="module">
        import {
            registerBorrower,
            loginBorrower
        } from './supabaseClient.js';

        const form = document.getElementById("userForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const nameField = document.getElementById("nameField");
        const phoneField = document.getElementById("phoneField");
        const confirmField = document.getElementById("confirmField");
        const nameInput = document.getElementById("name");
        const phoneInput = document.getElementById("phone");
        const confirmInput = document.getElementById("confirmPassword");
        const formMessage = document.getElementById("formMessage");
        const submitButton = document.getElementById("submitButton");
        let mode = "login";

        document.getElementById("year").textContent = new Date().getFullYear();

        function setMode(nextMode) {
            mode = nextMode;
            const registering = mode === "register";

            loginTab.classList.toggle("active", !registering);
            registerTab.classList.toggle("active", registering);

            nameField.hidden = !registering;
            phoneField.hidden = !registering;
            confirmField.hidden = !registering;

            nameInput.required = registering;
            phoneInput.required = registering;
            confirmInput.required = registering;

            document.getElementById("heading").textContent =
                registering ? "Create your account." : "Welcome back.";

            document.getElementById("subtitle").textContent =
                registering
                    ? "Register to get started with CREDORA."
                    : "Sign in to access your CREDORA account.";

            submitButton.textContent =
                registering ? "CREATE USER ACCOUNT →" : "LOGIN TO YOUR ACCOUNT →";

            document.getElementById("password").autocomplete =
                registering ? "new-password" : "current-password";

            formMessage.textContent =
                "Your account details should be kept secure.";
            formMessage.style.color = "#777";
        }

        loginTab.addEventListener("click", () => setMode("login"));
        registerTab.addEventListener("click", () => setMode("register"));

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (mode === "register") {
                if (password !== confirmInput.value) {
                    formMessage.textContent = "Passwords do not match. Please check and try again.";
                    formMessage.style.color = "#d00";
                    confirmInput.focus();
                    return;
                }

                const mobile = phoneInput.value.replace(/[\s\-\+]/g, '').slice(-10);
                if (!/^[6-9]\d{9}$/.test(mobile)) {
                    formMessage.textContent = "Please enter a valid 10-digit Indian mobile number (e.g. 9876543210).";
                    formMessage.style.color = "#d00";
                    phoneInput.focus();
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = "CREATING ACCOUNT...";
                formMessage.textContent = "Registering your account with CREDORA...";
                formMessage.style.color = "#555";

                try {
                    const res = await registerBorrower({
                        email,
                        password,
                        fullName: nameInput.value.trim(),
                        mobile,
                        state: "General",
                        city: "General"
                    });

                    if (res.requiresVerification) {
                        formMessage.textContent = `Registration successful! A verification email has been sent to ${email}. Please verify before logging in.`;
                        formMessage.style.color = "#080";
                        form.reset();
                    } else {
                        formMessage.textContent = "Registration successful! Redirecting to your profile...";
                        formMessage.style.color = "#080";
                        setTimeout(() => {
                            window.location.href = "profile.html";
                        }, 1200);
                    }
                } catch (err) {
                    formMessage.textContent = err.message || "Registration failed. Please try again.";
                    formMessage.style.color = "#d00";
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = "CREATE USER ACCOUNT →";
                }
            } else {
                submitButton.disabled = true;
                submitButton.textContent = "SIGNING IN...";
                formMessage.textContent = "Authenticating credentials...";
                formMessage.style.color = "#555";

                try {
                    const res = await loginBorrower(email, password);
                    formMessage.textContent = `Welcome back, ${res.profile?.full_name || 'User'}! Redirecting...`;
                    formMessage.style.color = "#080";
                    setTimeout(() => {
                        window.location.href = "profile.html";
                    }, 600);
                } catch (err) {
                    formMessage.textContent = err.message || "Login failed. Please check credentials.";
                    formMessage.style.color = "#d00";
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = "LOGIN TO YOUR ACCOUNT →";
                }
            }
        });
    </script>
</body>

</html>
